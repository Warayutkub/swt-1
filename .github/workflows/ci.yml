name: tests

# ไฟล์นี้ต้องอยู่ที่ .github/workflows/ ในรากของ repository เท่านั้น
# วางที่อื่น GitHub Actions จะไม่สนใจโดยไม่บอกอะไรเลย

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # Python เวอร์ชันหนึ่งแดง ไม่ควรบังอีกเวอร์ชันไม่ให้รัน
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: ติดตั้งเครื่องมือ
        run: python -m pip install --quiet pytest pytest-cov

      - name: รันเทสต์พร้อมวัด coverage
        # ตรวจสองอย่างพร้อมกัน เทสต์ต้องผ่านทุกตัว และ coverage ต้องถึงเกณฑ์ 85%
        # อย่างใดอย่างหนึ่งไม่ผ่าน = job นี้แดง
        run: python -m pytest --cov --cov-report=xml --junitxml=reports/junit.xml -v

      - name: สรุปผลขึ้นหน้ารัน
        if: always()
        run: |
          echo "## ผลการทดสอบ (Python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python scripts/summarize_junit.py reports/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: เก็บรายงานไว้ดาวน์โหลด
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python }}
          path: |
            reports/
            coverage.xml
          retention-days: 14
